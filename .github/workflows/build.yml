# Version 2023-03-05
name: Java CI
on: [push, pull_request]

jobs:
  build:
    uses: igniterealtime/openfire-plugin-builder-action/.github/workflows/openfire-plugin-build.yml@main
    secrets:
      IGNITE_REALTIME_MAVEN_USERNAME: ${{ secrets.IGNITE_REALTIME_MAVEN_USERNAME }}
      IGNITE_REALTIME_MAVEN_PASSWORD: ${{ secrets.IGNITE_REALTIME_MAVEN_PASSWORD }}
  readme-up-to-date:
    name: Check that the readme documents the current endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Regenerate the endpoint documentation
        run: mvn -B -DskipTests process-classes

      - name: Fail when the readme was not up to date
        run: |
          if ! git diff --exit-code readme.md; then
            echo "::error file=readme.md::The endpoint documentation in readme.md does not match the OpenAPI annotations in the source code. Run 'mvn process-classes' (or any later build phase, like 'mvn package') and commit the updated readme.md."
            exit 1
          fi
  hurl-e2e-test:
    name: Hurl E2E Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
        checks: write
    steps:
      - name: Checkout tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            test

      - name: Download the built plugin
        uses: actions/download-artifact@v8
        with:
          name: restAPI
          path: .

      - name: Rename plugin
        run: |
          mv restAPI-openfire-plugin-assembly.jar restAPI.jar
  
      - name: Run Openfire
        uses: igniterealtime/launch-openfire-action@main # Should this be tied to the Openfire version?
        with:
          version: 5.1.2
          config: ./test/demoboot-with-additions.xml
          plugin: ./restAPI.jar
      
      - uses: gacts/install-hurl@v1

      - name: Test the plugin
        run: |
          hurl --test --report-junit test-results.xml --variables-file test/test.env --jobs 1 test/*.hurl

      - name: Expose Openfire logs
        uses: actions/upload-artifact@v7
        if: always() # always run even if the previous step fails
        with:
          name: Openfire server logs
          path: openfire/logs/*

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: 'test-results.xml'
          include_passed: true
          detailed_summary: true
